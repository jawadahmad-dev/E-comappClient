<div class="dashboard-container">
  <!-- Main Chart: Spending Timeline -->
  <div class="bg-white rounded-xl shadow p-4 mb-6">
    <highcharts-chart
      [options]="chartOptions"
      [update]="updateFlag"
      style="width: 100%; height: 350px; display: block"
    ></highcharts-chart>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
      <p class="text-sm text-blue-600 font-medium">Total Orders</p>
      <p class="text-2xl font-bold text-blue-800">{{ orderArr.length }}</p>
    </div>
    <div class="bg-green-50 p-4 rounded-lg border border-green-100">
      <p class="text-sm text-green-600 font-medium">Total Spent</p>
      <p class="text-2xl font-bold text-green-800">${{ totalSpent.toLocaleString() }}</p>
    </div>
    <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
      <p class="text-sm text-purple-600 font-medium">Unique Products</p>
      <p class="text-2xl font-bold text-purple-800">
        {{ uniqueProductCount }}
      </p>
    </div>
  </div>
</div>
