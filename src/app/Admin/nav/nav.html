<nav
  class="sticky top-0 z-50 w-full backdrop-blur-xl bg-indigo-50 border-b border-gray-200/60 shadow-sm transition-all duration-300"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo -->
      <a routerLink="/admin" class="flex items-center gap-2.5 group cursor-pointer">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 shadow-md shadow-blue-500/20 transition-transform group-hover:scale-105"
        >
          <i class="pi pi-cog text-white text-lg"></i>
        </div>
        <span
          class="text-xl font-bold tracking-tight bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent group-hover:from-blue-600 group-hover:to-indigo-600 transition-all duration-300"
        >
          AdminPanel
        </span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-1.5">
        <a
          routerLink="/admin/inventory"
          routerLinkActive="bg-blue-50 text-blue-700 ring-1 ring-blue-200"
          [routerLinkActiveOptions]="{ exact: false }"
          class="px-4 py-1 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 flex items-center gap-2"
        >
          <i class="pi pi-box text-base"></i> Inventory
        </a>
        <a
          routerLink="/admin/orders"
          routerLinkActive="bg-blue-50 text-blue-700 ring-1 ring-blue-200"
          [routerLinkActiveOptions]="{ exact: false }"
          class="px-4 py-1 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 flex items-center gap-2"
        >
          <i class="pi pi-truck text-base"></i> Orders
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-blue-50 text-blue-700 ring-1 ring-blue-200"
          [routerLinkActiveOptions]="{ exact: false }"
          class="px-4 py-1 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-200 flex items-center gap-2"
        >
          <i class="pi pi-users text-base"></i> Users
        </a>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-3">
        <a
          routerLink="/admin/profile"
          class="cursor-pointer hover:ring-1 hover:ring-blue-400 hover:ring-offset-2 rounded-full transition-all"
        >
          <p-avatar icon="pi pi-user" shape="circle" size="normal"></p-avatar>
        </a>

        <!-- Logout Button -->
        <p-button
          icon="pi pi-sign-out"
          iconPos="right"
          severity="danger"
          text
          rounded
          class="hidden sm:inline-flex hover:!text-red-600 transition-all"
          (click)="authService.logout()"
        ></p-button>

        <!-- Mobile Menu Toggle -->
        <button
          class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
          (click)="isMobileMenuOpen = !isMobileMenuOpen"
          [attr.aria-expanded]="isMobileMenuOpen"
          aria-label="Toggle navigation menu"
        >
          <i
            class="pi text-xl"
            [class.pi-bars]="!isMobileMenuOpen"
            [class.pi-times]="isMobileMenuOpen"
          ></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (isMobileMenuOpen) {
    <div
      class="md:hidden border-t border-gray-200/60 bg-white/95 backdrop-blur-sm overflow-hidden transition-all duration-300 ease-in-out"
    >
      <div class="px-4 py-3 space-y-1">
        <a
          routerLink="/admin/inventory"
          routerLinkActive="bg-blue-50 text-blue-700"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
        >
          <i class="pi pi-box text-base"></i> Inventory
        </a>
        <a
          routerLink="/admin/orders"
          routerLinkActive="bg-blue-50 text-blue-700"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
        >
          <i class="pi pi-truck text-base"></i> Orders
        </a>
        <a
          routerLink="/admin/users"
          routerLinkActive="bg-blue-50 text-blue-700"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors"
        >
          <i class="pi pi-users text-base"></i> Users
        </a>
        <div class="pt-3 mt-2 border-t border-gray-100">
          <p-button
            label="Logout"
            icon="pi pi-sign-out"
            iconPos="right"
            severity="danger"
            class="w-full justify-center"
            (click)="authService.logout()"
          ></p-button>
        </div>
      </div>
    </div>
  }
</nav>

<!-- Main Content Area -->
<main class="min-h-[calc(100vh-4rem)] bg-gray-50/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
  </div>
</main>
